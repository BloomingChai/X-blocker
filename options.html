<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X黄评屏蔽器词库管理</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="hero-title-row">
          <img class="brand-mark" src="brand-mark.png" alt="" aria-hidden="true" />
          <h1>词库管理页</h1>
        </div>
        <p class="hero__copy">完整查看和管理账号敏感词与自定义短词，改动会立即影响当前屏蔽规则。</p>
      </section>

      <section class="library-panel">
        <section class="table-panel">
          <div class="table-panel__head">
            <div>
              <p class="table-panel__kicker">优先放行</p>
              <h2>白名单账号</h2>
            </div>
            <span id="whitelist-count" class="table-panel__count">0</span>
          </div>
          <form id="whitelist-handle-form" class="inline-form table-panel__form">
            <input id="whitelist-handle-input" type="text" placeholder="新增白名单账号，例如：@trusted_user" maxlength="30" />
            <button type="submit">添加白名单</button>
          </form>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>词条</th>
                  <th>类型</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="whitelist-table"></tbody>
            </table>
          </div>
        </section>

        <section class="table-panel">
          <div class="table-panel__head">
            <div>
              <p class="table-panel__kicker">账号规则</p>
              <h2>账号敏感词</h2>
            </div>
            <button id="reset-profile-keywords" class="table-panel__action" type="button">恢复默认账号词</button>
          </div>
          <form id="profile-keyword-form" class="inline-form table-panel__form">
            <input id="profile-keyword-input" type="text" placeholder="新增账号敏感词" maxlength="30" />
            <button type="submit">添加账号词</button>
          </form>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>词条</th>
                  <th>类型</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="profile-table"></tbody>
            </table>
          </div>
        </section>

        <section class="table-panel">
          <div class="table-panel__head">
            <div>
              <p class="table-panel__kicker">快速扩展</p>
              <h2>自定义短词</h2>
            </div>
            <span id="custom-short-count" class="table-panel__count">0</span>
          </div>
          <form id="short-keyword-form" class="inline-form table-panel__form">
            <input id="short-keyword-input" type="text" placeholder="新增自定义短词" maxlength="30" />
            <button type="submit">添加短词</button>
          </form>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>词条</th>
                  <th>类型</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="custom-short-table"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
