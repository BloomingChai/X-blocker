<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X信息屏蔽器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <section class="hero-card">
        <div class="hero-card__content">
          <div class="hero-title-row">
            <img class="brand-mark" src="brand-mark.png" alt="" aria-hidden="true" />
            <h1>X信息屏蔽器</h1>
          </div>
          <p class="hero-card__copy">集中管理白名单、账号敏感词和内容敏感词，改动会立即参与当前屏蔽规则。</p>
          <div class="hero-stats">
            <div class="stat">
              <span class="stat__label">白名单账号</span>
              <strong id="whitelist-count" class="stat__value">0</strong>
            </div>
            <div class="stat">
              <span class="stat__label">账号敏感词</span>
              <strong id="profile-count" class="stat__value">0</strong>
            </div>
            <div class="stat">
              <span class="stat__label">内容敏感词</span>
              <strong id="content-count" class="stat__value">0</strong>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel__header">
          <div>
            <p class="panel__kicker">优先放行</p>
            <h2>白名单账号</h2>
          </div>
        </div>
        <form id="whitelist-handle-form" class="stack-form">
          <input id="whitelist-handle-input" type="text" placeholder="例如：@trusted_user" maxlength="30" />
          <button type="submit">添加白名单</button>
        </form>
        <div id="whitelist-handles" class="chip-grid"></div>
      </section>

      <section class="panel">
        <div class="panel__header">
          <div>
            <p class="panel__kicker">账号规则</p>
            <h2>账号敏感词</h2>
          </div>
        </div>
        <form id="profile-keyword-form" class="stack-form">
          <input id="profile-keyword-input" type="text" placeholder="例如：线下、可约、私聊主页" maxlength="30" />
          <button type="submit">添加账号词</button>
        </form>
        <div id="profile-keywords" class="chip-grid"></div>
      </section>

      <section class="panel">
        <div class="panel__header">
          <div>
            <p class="panel__kicker">内容规则</p>
            <h2>内容敏感词</h2>
          </div>
        </div>
        <form id="content-keyword-form" class="stack-form">
          <input id="content-keyword-input" type="text" placeholder="例如：求抱走、会撒娇" maxlength="30" />
          <button type="submit">添加内容词</button>
        </form>
        <div id="content-keywords" class="chip-grid"></div>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
